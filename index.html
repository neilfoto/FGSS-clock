* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
  font-family: "FGSS HK", "Microsoft JhengHei", "PingFang HK", "PingFang TC", "Noto Sans CJK HK", "Noto Sans CJK TC", sans-serif;
  -webkit-font-smoothing: antialiased; user-select: none;
}
body { display: grid; grid-template-rows: auto 1fr; }

/* ---------- 左上角：校徽 + 校名 ---------- */
header {
  display: flex; align-items: center; justify-content: center; gap: 1.6vw;
  padding: 3.2vh 3vw 0 3vw; position: relative; z-index: 2;
}
header img {
  height: 13.5vh; width: auto; display: block;
  filter: drop-shadow(0 0 0.35vh rgba(255,255,255,.35));
}
header h1 {
  margin: 0; font-weight: 700; font-size: 6vh; letter-spacing: .18em; margin-right: -.18em; line-height: 1;
  color: #fff; text-shadow: 0 0 1.2vh rgba(255,255,255,.18);
}

/* ---------- 時鐘：幼身復古外框 ---------- */
main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4.2vh; padding: 0 3vw 8vh; min-height: 0; }
.bezel {
  position: relative; border-radius: 2.6vh; padding: 1.4vh;
  background: linear-gradient(160deg, #80858a 0%, #4a4e4d 16%, #2c2f2e 48%, #262928 72%, #444847 90%, #6e7371 100%);
  box-shadow:
    0 0 0 0.25vh #0a0a0a,                      /* 外圈黑邊 */
    0 0 0 0.4vh #4c5150,                       /* 外圈金屬線 */
    0 1.5vh 4vh rgba(0,0,0,.9),
    inset 0 0.25vh 0.15vh rgba(255,255,255,.3), /* 頂部反光 */
    inset 0 -0.25vh 0.2vh rgba(0,0,0,.55);
}

.screen {
  position: relative; border-radius: 1.4vh; overflow: hidden;
  padding: 4.6vh 4.4vw;
  background: radial-gradient(ellipse at 50% 35%, #0b0c0c, #000 75%);
  border: 0.35vh solid #050505;
  box-shadow: 0 0 0 0.15vh #8a8f8d, inset 0 0 0 0.2vh #2b2e2d, inset 0 1.2vh 3vh rgba(0,0,0,.95);
}
/* 玻璃反光（極淡） */
.screen::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(168deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.015) 30%, transparent 31%);
}

.time {
  display: flex; align-items: center; justify-content: center;
  font-family: "FGSS Digits", "Segoe UI", Arial, sans-serif; font-weight: 700;
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  font-size: min(26vw, 44vh); line-height: .8; letter-spacing: -0.01em;
  color: #fff;
  text-shadow: 0 0 .02em rgba(255,255,255,.4), 0 0 .09em rgba(255,255,255,.12);
  white-space: nowrap;
}
.colon {
  font-feature-settings: "tnum" 1, "case" 1;   /* 冒號垂直置中 */
  margin: 0 .04em; position: relative; top: -.02em;
}
/* 日期 */
.date {
  font-family: "FGSS Date Digits", "FGSS HK Date", "Microsoft JhengHei", "PingFang HK", sans-serif;
  font-weight: 400; font-variant-numeric: tabular-nums;
  font-size: 5.6vh; line-height: 1; letter-spacing: .08em; color: #e8e8e8;
  text-shadow: 0 0 1vh rgba(255,255,255,.12); white-space: nowrap;
  position: fixed; left: 50%; bottom: 4.5vh; transform: translateX(-50%); z-index: 1;
}
.date .wd { margin-left: .9em; }

/* ---------- 右下角：復古硬件按鈕 ---------- */
.controls {
  position: fixed; right: 2.4vw; bottom: 2.8vh; display: flex; z-index: 5;
  transition: opacity .5s ease;
}
.btn {
  appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: .6em;
  font: 700 max(12px, 1.55vh)/1 "FGSS HK", "Microsoft JhengHei", sans-serif; letter-spacing: .12em;
  color: #d6d9d8; padding: .75em 1.05em .7em;
  border-radius: .55em; border: 1px solid #4a4d4c;
  background: linear-gradient(#3b3e3d, #232524 55%, #1a1b1b);
  box-shadow: 0 .32em 0 #070707, 0 .4em .8em rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18);
  transform: translateY(0); transition: transform .06s, box-shadow .06s, color .2s;
}
.btn:hover { color: #fff; }
.btn:active { transform: translateY(.26em); box-shadow: 0 .06em 0 #070707, inset 0 1px 0 rgba(255,255,255,.1); }
.btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.btn svg { width: 1.15em; height: 1.15em; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.led { width: .55em; height: .55em; border-radius: 50%; background: #2a1010; box-shadow: inset 0 0 2px #000; }
.fs-on .led { background: #4dff7a; box-shadow: 0 0 .5em #4dff7a; }
.icon-exit { display: none; }
.fs-on .icon-exit { display: block; } .fs-on .icon-enter { display: none; }

/* 閒置 3 秒後隱藏滑鼠及按鈕 */
body.idle, body.idle * { cursor: none !important; }
body.idle .controls { opacity: 0; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  .controls, .btn { transition: none; }
}
</style>
</head>

  <h1>粉嶺官立中學</h1>
</header>

<main>
  <div class="bezel">
    <div class="screen">
      <div class="time" id="time" role="timer" aria-live="off" aria-label="現在時間">
        <span id="hh">00</span><span class="colon" id="colon">:</span><span id="mm">00</span>
      </div>
    </div>
  </div>
  <div class="date" id="date"><span id="ymd"></span><span class="wd" id="wd"></span></div>
</main>

<div class="controls" id="controls">
  <button class="btn" id="fsBtn" type="button" title="全螢幕（F）">
    <span class="led"></span>
    <svg class="icon-enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg class="icon-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    <span id="fsLabel">全螢幕</span>
  </button>
</div>

<script>
(() => {
  "use strict";
  // ---- 時間（24 小時制，時：分；冒號長亮）及日期 ----
  const hhEl = document.getElementById("hh"), mmEl = document.getElementById("mm"), timeEl = document.getElementById("time");
  const ymdEl = document.getElementById("ymd"), wdEl = document.getElementById("wd");
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  let lastDate = "";
  function tick() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    if (hhEl.textContent !== hh) hhEl.textContent = hh;
    if (mmEl.textContent !== mm) { mmEl.textContent = mm; timeEl.setAttribute("aria-label", `現在時間 ${hh}:${mm}`); }
    const ymd = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
    if (ymd !== lastDate) {           // 午夜（或電腦休眠後）自動轉日期
      lastDate = ymd;
      ymdEl.textContent = ymd;
      wdEl.textContent = "星期" + WEEK[now.getDay()];
    }
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);   // 每秒對時一次
  }
  tick();

  // ---- 全螢幕（按鈕 / F 鍵 / 雙擊） ----
  const fsBtn = document.getElementById("fsBtn"), fsLabel = document.getElementById("fsLabel");
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  function toggleFS() {
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else {
      const root = document.documentElement;
      const req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (req) { const p = req.call(root); if (p && p.catch) p.catch(() => {}); }
    }
  }
  function onFSChange() {
    const on = !!fsEl();
    fsBtn.classList.toggle("fs-on", on);
    fsLabel.textContent = on ? "退出全螢幕" : "全螢幕";
    fsBtn.title = on ? "退出全螢幕（F / Esc）" : "全螢幕（F）";
    wake();
  }
  fsBtn.addEventListener("click", toggleFS);
  document.addEventListener("fullscreenchange", onFSChange);
  document.addEventListener("webkitfullscreenchange", onFSChange);
  document.addEventListener("dblclick", e => { if (!e.target.closest(".controls")) toggleFS(); });
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "f" || e.key === "F") { e.preventDefault(); toggleFS(); }
  });

  // ---- 閒置 3 秒隱藏滑鼠及按鈕 ----
  let idleTimer;
  function active() {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
  }
  ["mousemove", "mousedown", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, active, { passive: true }));
  active();

  // ---- 防止螢幕休眠（瀏覽器支援才會生效） ----
  let lock = null;
  async function wake() {
    try {
      if ("wakeLock" in navigator && document.visibilityState === "visible" && !lock) {
        lock = await navigator.wakeLock.request("screen");
        lock.addEventListener("release", () => { lock = null; });
      }
    } catch (e) { lock = null; }
  }
  document.addEventListener("visibilitychange", wake);
  wake();
})();
</script>
</body>
</html>
